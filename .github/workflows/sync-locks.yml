name: Sync Lock Files

on:
  push:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@e4f4bde15728394ded896ef07491a85f2eb24956 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Format Nix files
        run: nix fmt

      - name: Sync nix-nvim-pack-lock.json
        run: bash sync-pack-revs.sh

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 # v5.0.1
        with:
          commit_message: "chore: sync lock files and format"
          file_pattern: "flake.lock nix-nvim-pack-lock.json **/*.nix"
