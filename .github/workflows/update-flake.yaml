# Runs weekly (Thursday 04:00 UTC) and on manual dispatch.
# Updates flake.lock to the latest revisions of all inputs and commits the result.
name: Update flake lock
on:
  schedule:
    - cron: "0 4 * * 4"
  workflow_dispatch:
jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Update flake inputs
        run: nix flake update
      - name: Commit updated flake.lock
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: Updated deps"
          commit_user_name: Flake Bot Update
          commit_author: Flake Bot Update <actions@github.com>
          branch: main
          skip_dirty_check: false
          skip_fetch: true
